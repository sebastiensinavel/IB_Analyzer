[project]
name = "ib-tws-agent"
version = "0.3.0"
description = "Agent local d'IB Options Analyzer 2 : lit TWS sur cette machine, ne stocke rien, ne parle qu'au site et à Interactive Brokers."
requires-python = ">=3.14"
dependencies = [
    "ib_async>=2.1,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "platformdirs>=4,<5",
    "httpx>=0.27,<1",
]

[project.scripts]
ib-tws-agent = "ib_tws_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ib_tws_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

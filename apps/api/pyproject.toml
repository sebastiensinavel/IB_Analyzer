[project]
name = "ib-analyzer-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6.0",
    "django-ninja>=1.3",
    "django-allauth[mfa]>=65",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "whitenoise>=6.7",
    "gunicorn>=23",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "core", "ib"]
